name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Flutter code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env
        env:
          CLOUDINARY_CLOUDNAME: ${{ secrets.CLOUDINARY_CLOUDNAME }}
          CLOUDINARY_APIKEY: ${{ secrets.CLOUDINARY_APIKEY }}
          CLOUDINARY_APISECRET: ${{ secrets.CLOUDINARY_APISECRET }}
          OLLAMA_APIKEY: ${{ secrets.OLLAMA_APIKEY }}
        run: |
          echo "CLOUDINARY_CLOUDNAME=$CLOUDINARY_CLOUDNAME" >> .env
          echo "CLOUDINARY_APIKEY=$CLOUDINARY_APIKEY" >> .env
          echo "CLOUDINARY_APISECRET=$CLOUDINARY_APISECRET" >> .env
          echo "OLLAMA_APIKEY=$OLLAMA_APIKEY" >> .env
        shell: bash

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  android:
    name: Build Android Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      
      - name: Create .env
        env:
          CLOUDINARY_CLOUDNAME: ${{ secrets.CLOUDINARY_CLOUDNAME }}
          CLOUDINARY_APIKEY: ${{ secrets.CLOUDINARY_APIKEY }}
          CLOUDINARY_APISECRET: ${{ secrets.CLOUDINARY_APISECRET }}
          OLLAMA_APIKEY: ${{ secrets.OLLAMA_APIKEY }}
        run: |
          echo "CLOUDINARY_CLOUDNAME=$CLOUDINARY_CLOUDNAME" >> .env
          echo "CLOUDINARY_APIKEY=$CLOUDINARY_APIKEY" >> .env
          echo "CLOUDINARY_APISECRET=$CLOUDINARY_APISECRET" >> .env
          echo "OLLAMA_APIKEY=$OLLAMA_APIKEY" >> .env
        shell: bash

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android debug APK
        run: flutter build apk --debug

  windows:
    name: Build Windows Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false
          
      - name: Create .env
        env:
          CLOUDINARY_CLOUDNAME: ${{ secrets.CLOUDINARY_CLOUDNAME }}
          CLOUDINARY_APIKEY: ${{ secrets.CLOUDINARY_APIKEY }}
          CLOUDINARY_APISECRET: ${{ secrets.CLOUDINARY_APISECRET }}
          OLLAMA_APIKEY: ${{ secrets.OLLAMA_APIKEY }}
        run: |
          echo "CLOUDINARY_CLOUDNAME=$CLOUDINARY_CLOUDNAME" >> .env
          echo "CLOUDINARY_APIKEY=$CLOUDINARY_APIKEY" >> .env
          echo "CLOUDINARY_APISECRET=$CLOUDINARY_APISECRET" >> .env
          echo "OLLAMA_APIKEY=$OLLAMA_APIKEY" >> .env
        shell: bash

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --debug


  macos:
    name: Build macOS Test
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Create .env
        env:
          CLOUDINARY_CLOUDNAME: ${{ secrets.CLOUDINARY_CLOUDNAME }}
          CLOUDINARY_APIKEY: ${{ secrets.CLOUDINARY_APIKEY }}
          CLOUDINARY_APISECRET: ${{ secrets.CLOUDINARY_APISECRET }}
          OLLAMA_APIKEY: ${{ secrets.OLLAMA_APIKEY }}
        run: |
          echo "CLOUDINARY_CLOUDNAME=$CLOUDINARY_CLOUDNAME" >> .env
          echo "CLOUDINARY_APIKEY=$CLOUDINARY_APIKEY" >> .env
          echo "CLOUDINARY_APISECRET=$CLOUDINARY_APISECRET" >> .env
          echo "OLLAMA_APIKEY=$OLLAMA_APIKEY" >> .env
        shell: bash

      - name: Install dependencies
        run: flutter pub get

      - name: Disable macOS code signing
        run: |
          cat > macos/Runner/Configs/Local.xcconfig <<'EOF'
          DEVELOPMENT_TEAM =
          CODE_SIGN_IDENTITY =
          CODE_SIGN_STYLE = Manual
          CODE_SIGNING_ALLOWED = NO
          CODE_SIGNING_REQUIRED = NO
          ENABLE_HARDENED_RUNTIME = NO
          EOF

      - name: Build macOS
        run: flutter build macos --debug