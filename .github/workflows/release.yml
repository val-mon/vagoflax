name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Show release version
        run: |
          echo "Version: $VERSION"
          echo "Build number: $BUILD_NUMBER"

      - name: Restore Android keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" \
            | base64 --decode \
            > android/app/release.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=release.jks
          EOF

      - name: Build Android APK
        run: |
          flutter build apk \
            --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER"

      - name: Build Android App Bundle
        run: |
          flutter build appbundle \
            --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER"

      - name: Rename Android artifacts
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
            "vagoflax-${GITHUB_REF_NAME}-android.apk"

          mv build/app/outputs/bundle/release/app-release.aab \
            "vagoflax-${GITHUB_REF_NAME}-android.aab"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v6
        with:
          name: android
          path: |
            vagoflax-${{ github.ref_name }}-android.apk
            vagoflax-${{ github.ref_name }}-android.aab

      - name: Upload AAB to Google Play Internal Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ch.hevs.vagoflax
          releaseFiles: vagoflax-${{ github.ref_name }}-android.aab
          tracks: internal
          status: completed


  windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set release version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BUILD_NUMBER=${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Windows
        run: |
          flutter build windows `
            --release `
            --build-name="$env:VERSION" `
            --build-number="$env:BUILD_NUMBER"

      - name: Package Windows release
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build\windows\x64\runner\Release\* `
            -DestinationPath "vagoflax-${{ github.ref_name }}-windows-x64.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: windows
          path: vagoflax-${{ github.ref_name }}-windows-x64.zip


  macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Set release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build macOS
        run: |
          flutter build macos \
            --release \
            --build-name="$VERSION" \
            --build-number="$BUILD_NUMBER"

      - name: Package macOS app
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release \
            -maxdepth 1 \
            -name "*.app" \
            | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found"
            exit 1
          fi

          ditto \
            -c \
            -k \
            --sequesterRsrc \
            --keepParent \
            "$APP_PATH" \
            "vagoflax-${GITHUB_REF_NAME}-macos.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: macos
          path: vagoflax-${{ github.ref_name }}-macos.zip


  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest

    needs:
      - android
      - windows
      - macos

    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v5
        with:
          name: android
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: windows
          path: release-assets

      - name: Download macOS artifact
        uses: actions/download-artifact@v5
        with:
          name: macos
          path: release-assets

      - name: List release assets
        run: ls -lah release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*